<!DOCTYPE html>
<html lang="id" data-tema="gelap">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio</title>
<meta name="description" content="Portofolio pribadi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<nav class="nav glass" aria-label="Menu utama">
  <a href="#beranda" class="on">Beranda</a>
  <a href="#tentang">Tentang</a>
  <a href="#kontak">Kontak</a>
  <button id="tema" type="button" aria-label="Ganti tema terang atau gelap">◐</button>
</nav>

<main class="w">
  <section id="beranda" class="hero">
    <div>
      <p class="salam" id="sapaan"></p>
      <h1 id="nama"></h1>
      <p class="peran" id="peran"></p>
      <p class="lead" id="tagline"></p>
      <div class="cta" id="cta"><a class="btn primary" href="#proyek">Lihat proyek</a><a class="btn glass" href="#kontak">Hubungi saya</a></div>
    </div>
    <div class="avatar glass" id="avatar"></div>
  </section>

  <section id="tentang">
    <h2>Tentang saya</h2>
    <div class="dua">
      <div class="glass kartu">
        <p id="tentang-teks"></p>
        <p class="lokasi" id="lokasi"></p>
        <div class="stat" id="stat"></div>
      </div>
      <div class="glass kartu"><h3>Keahlian</h3><div class="chips" id="keahlian"></div></div>
    </div>
  </section>

  <section id="kontak">
    <h2>Mari ngobrol</h2>
    <div class="glass kartu besar">
      <a class="email" id="email"></a>
      <div class="cta" id="sosial"></div>
    </div>
  </section>
</main>
<footer class="w" id="footer"></footer>
<script src="js/main.js"></script>
</body>
</html>
